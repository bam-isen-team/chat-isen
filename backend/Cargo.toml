[package]
name = "chatisen-backend"
version = "0.1.0"
edition = "2024"
description = "ChatISEN backend: REST API and real-time WebSocket server"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
mime = "0.3"

[profile.release]
lto = true
strip = true
